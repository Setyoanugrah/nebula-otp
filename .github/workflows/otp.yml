name: otp

on:
  workflow_dispatch:
  schedule:
    # restart every 6 hours; the job itself lives 355 minutes so the new run
    # takes over before the old one is killed
    - cron: "10 */6 * * *"

concurrency:
  group: otp
  cancel-in-progress: true

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore database
        env:
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
        run: |
          mkdir -p data
          python3 - <<'EOF'
          import base64, json, os, urllib.request, urllib.error

          tok = os.environ.get("STATE_TOKEN", "")
          if not tok:
              print("no STATE_TOKEN, starting with an empty database")
              raise SystemExit(0)

          # the service repo is public (unlimited runner minutes); the database
          # holds live credentials, so it is backed up to a private repo instead
          repo = os.environ.get("BACKUP_REPO") or os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/contents/otp.db.b64"
          req = urllib.request.Request(url, headers={"Authorization": f"token {tok}"})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  doc = json.load(r)
              raw = base64.b64decode(doc["content"])
              open("data/otp.db", "wb").write(raw)
              print(f"restored {len(raw)} bytes")
          except urllib.error.HTTPError as e:
              print(f"no backup yet ({e.code}), starting fresh")
          EOF

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Install edge client
        run: |
          curl -fsSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared

      - name: Serve
        env:
          EDGE_TOKEN: ${{ secrets.EDGE_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMS_GATEWAY_URL: ${{ secrets.SMS_GATEWAY_URL }}
          SMS_GATEWAY_TOKEN: ${{ secrets.SMS_GATEWAY_TOKEN }}
          OTP_ADMIN_TOKEN: ${{ secrets.OTP_ADMIN_TOKEN }}
          OTP_DB: ${{ github.workspace }}/data/otp.db
          OTP_TTL: "300"
          OTP_COOLDOWN: "60"
          OTP_MAX_ATTEMPTS: "5"
          OTP_DAILY_QUOTA: "200"
          OTP_DEV_MODE: "0"
          PORT: "8099"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "${EDGE_TOKEN:-}" ]; then
            cloudflared tunnel --no-autoupdate run --token "$EDGE_TOKEN" > /tmp/cf.log 2>&1 &
          else
            # no named tunnel: a quick tunnel gives a random public URL each run
            cloudflared tunnel --url http://localhost:8099 --no-autoupdate > /tmp/cf.log 2>&1 &
          fi
          sleep 10
          URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          [ -z "$URL" ] && URL="https://otp.rikuzetsi.my.id"
          if [ -n "$URL" ]; then
            echo "PUBLIC_URL=$URL"
            echo "### OTP service live at $URL" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${NTFY_TOPIC:-}" ]; then
              curl -s --max-time 15 -H "Title: OTP service" \
                -d "URL: $URL" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
            fi
          fi
          timeout 20400 python3 -u app.py

      - name: Backup database
        if: always()
        env:
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
        run: |
          python3 - <<'EOF'
          import base64, json, os, urllib.request, urllib.error

          tok = os.environ.get("STATE_TOKEN", "")
          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "data", "otp.db")
          if not tok or not os.path.exists(path):
              print("nothing to back up")
              raise SystemExit(0)

          repo = os.environ.get("BACKUP_REPO") or os.environ["GITHUB_REPOSITORY"]
          api = f"https://api.github.com/repos/{repo}/contents/otp.db.b64"
          raw = base64.b64encode(open(path, "rb").read()).decode()

          sha = None
          try:
              req = urllib.request.Request(api, headers={"Authorization": f"token {tok}"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  sha = json.load(r)["sha"]
          except urllib.error.HTTPError:
              pass

          body = {"message": "backup: otp database", "content": raw}
          if sha:
              body["sha"] = sha
          req = urllib.request.Request(api, data=json.dumps(body).encode(), method="PUT",
                                       headers={"Authorization": f"token {tok}",
                                                "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=90) as r:
              print("backup pushed", json.load(r)["commit"]["sha"][:8])
          EOF
